<div class="container py-5">
  <div class="card p-4">
    <!-- Header -->
    <div class="mb-4 header-info">
      <h2 class="fw-bold">{{ client.name }}</h2>
      <p class="text-muted">{{ client.email }}</p>

    </div>

    <!-- Search and Add -->
    <div class="row mb-4 g-2">
      <div class="col-sm-9 col-12">
        <input type="text" class="form-control" placeholder="Buscar...">
      </div>
      <div class="col-sm-3 col-12">
        <button class="btn btn-primary" (click)="showModal = true">Añadir</button>

        <app-addcenter *ngIf="showModal" [id_client]="client.id" (onClose)="showModal = false"></app-addcenter>
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped align-middle">
        <thead class="table-light">
          <tr>
            <th>Calle</th>
            <th>Código Postal</th>
            <th>Localización</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let center of centers">
            <td>{{center.address}}</td>
            <td>{{center.zipCode}}</td>
            <td>{{center.location}}</td>
            <td>{{center.telephone}}</td>
            <td><span class="badge bg-danger text-white">Archivado</span></td>
            <td>
              <button class="btn btn-sm btn-success me-1" (click)="btnAccederCenter(center)">Acceder</button>
              <button class="btn btn-sm btn-danger">Eliminar</button>
            </td>
          </tr>
          <!-- Más filas aquí -->
        </tbody>
      </table>
    </div>
  </div>
</div>
