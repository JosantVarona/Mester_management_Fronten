<button class="btn btn-secondary btn-back" (click)="back()">← Volver</button>
<div class="container py-5">
  
  <div class="card p-4">
    <!-- Header -->
    <div class="mb-4 header-info">
      <h2 class="fw-bold">{{ client.name }}</h2>
      <p class="text-muted">{{ client.email }}</p>

    </div>

    <!-- Search and Add -->
    <div class="row mb-4 g-2">
      <div class="col-sm-9 col-12">
        <input type="text" class="form-control" placeholder="Buscar..." [(ngModel)]="filterText" name="filter">
      </div>
      <div class="col-sm-3 col-12">
        <button class="btn btn-primary" (click)="btnAddCenter()">Añadir</button>

        <app-addcenter *ngIf="showModal" [id_client]="client.id" [updatecenter]="updatecenter" (onClose)="handleClose()"></app-addcenter>
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped align-middle">
        <thead class="table-light">
          <tr>
            <th>Calle</th>
            <th>Código Postal</th>
            <th>Localización</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let center of filteredClients; let i = index;">
            <td>{{center.address}}</td>
            <td>{{center.zipCode}}</td>
            <td>{{center.location}}</td>
            <td>{{center.telephone}}</td>
            <td>
              <span *ngIf="center.archive == 1" class="badge bg-danger text-white">Archivado</span>
              <span *ngIf="center.archive == 0" class="badge bg-success text-white">Activo</span>
            </td>
            <td>
              <button class="btn btn-sm btn-success me-1"  (click)="btnAccederCenter(center)">Acceder</button>
              <button class="btn btn-sm btn-warning me-2" *ngIf="user.level == 3" (click)="btnEditCenter(center)" >Editar</button>
              <button class="btn btn-sm btn-primary me-2"*ngIf="center.archive == 0 && user.level == 3" (click)="btnArchiveCenter(center)">Archivar</button>
              <button class="btn btn-sm btn-primary me-2"*ngIf="center.archive == 1 && user.level == 3" (click)="btnArchiveCenter(center)">Desarchivar</button>
              <button class="btn btn-sm btn-danger" *ngIf="user.level == 3 && center.archive == 1" (click)="btnDeleteCenter(center)">Eliminar</button>
            </td>
          </tr>
          <!-- Más filas aquí -->
        </tbody>
      </table>
    </div>
  </div>
</div>
